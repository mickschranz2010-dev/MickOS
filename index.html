<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MickOS</title>
<style>
:root{--ac:#3b7be8;--glass:rgba(20,22,42,.86);--tx:#eef0fa;--mu:#9aa0c0;--ln:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:#10122a}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wall{position:fixed;inset:0;background:linear-gradient(135deg,#14182e,#3b1d4a);background-size:cover}
.wall.w2{background:linear-gradient(160deg,#06222b,#0d5c63 60%,#1b3a4b)}
.wall.w3{background:radial-gradient(circle at 30% 20%,#5b2a86,#1a1033 60%,#0b0a1a)}
.wall.w4{background:#16181f}
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:9999}
.card{width:min(360px,92vw);background:var(--glass);border:1px solid var(--ln);border-radius:14px;padding:28px;backdrop-filter:blur(18px)}
.card h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
.card p{margin:0 0 18px;color:var(--mu)}
.card input{width:100%;margin-bottom:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--ln);background:rgba(255,255,255,.06)}
.btn{background:var(--ac);color:#08111a;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.card .btn{width:100%}
.err{color:#ff8a9a;min-height:20px;margin-top:8px}
#desk{position:fixed;inset:0 0 44px 0}
.icons{position:absolute;inset:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.ico{width:84px;padding:8px 4px;text-align:center;background:none;border:0;border-radius:8px}
.ico:hover{background:rgba(255,255,255,.1)}
.ico span{display:block;font-size:30px}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--glass);border-top:1px solid var(--ln);backdrop-filter:blur(18px);z-index:5000}
#start{background:var(--ac);color:#08111a;border:0;border-radius:8px;padding:6px 14px;font-weight:700}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
.tk{background:rgba(255,255,255,.07);border:0;border-bottom:2px solid transparent;border-radius:6px;padding:5px 10px;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tk.on{border-bottom-color:var(--ac);background:rgba(255,255,255,.15)}
#clock{padding:0 8px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
#menu{position:fixed;left:8px;bottom:52px;width:240px;background:var(--glass);border:1px solid var(--ln);border-radius:12px;padding:8px;backdrop-filter:blur(18px);z-index:5001}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px}
#menu button:hover{background:rgba(255,255,255,.1)}
#menu hr{border:0;border-top:1px solid var(--ln);margin:6px 0}
.win{position:absolute;display:flex;flex-direction:column;max-width:100vw;min-width:260px;min-height:160px;background:var(--glass);border:1px solid var(--ln);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(18px);resize:both;overflow:hidden}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 44px)!important;border-radius:0;resize:none}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(255,255,255,.05);cursor:move;touch-action:none;user-select:none}
.tb b{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb button{width:26px;height:24px;border:0;border-radius:5px;background:rgba(255,255,255,.08)}
.tb button:hover{background:rgba(255,255,255,.2)}
.tb .x:hover{background:#e5484d}
.body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.term{font:13px/1.5 Consolas,monospace;padding:10px;background:rgba(0,0,0,.35);height:100%;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term input{background:none;border:0;outline:0;width:70%;font:inherit}
.pr{color:var(--ac)}
textarea.np{flex:1;resize:none;border:0;background:rgba(0,0,0,.25);padding:10px;font:14px/1.5 Consolas,monospace;outline:0}
.bar2{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--ln);align-items:center}
.bar2 button,.sm{background:rgba(255,255,255,.1);border:0;border-radius:6px;padding:5px 10px}
.bar2 button:hover,.sm:hover{background:rgba(255,255,255,.2)}
.fl{padding:6px;overflow:auto}
.fi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}
.fi:hover{background:rgba(255,255,255,.08)}
.fi .n{flex:1;cursor:pointer}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;flex:1}
.calc .d{grid-column:1/5;background:rgba(0,0,0,.35);border-radius:8px;padding:10px;text-align:right;font-size:26px;overflow:hidden}
.calc button{background:rgba(255,255,255,.1);border:0;border-radius:8px;font-size:18px}
.calc button:hover{background:rgba(255,255,255,.2)}
.calc .op{background:var(--ac);color:#08111a}
.set{padding:14px;display:grid;gap:14px}
.sw{display:inline-block;width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);margin-right:6px}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .12s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
@media (max-width:600px){.win{width:96vw!important;left:2vw!important}}

/* ===== Retro-Modern: Bevel-Rahmen wie Windows 98/2000, flache Farben und runde Ecken wie heute ===== */
:root{--face:#d9dce3;--hi:#fff;--sh:#6b7080;--ink:#1a1d2b}
.wall{background:linear-gradient(135deg,#0c5a66,#13828f 55%,#1d4e89)}
.ico{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.ico:hover,.ico:focus-visible{background:rgba(255,255,255,.18);outline:1px dotted #fff}
.bv,.card,.win,#bar,#menu,.tb button,.bar2 button,.sm,.btn,.calc button,.tk,#start{background:var(--face);color:var(--ink)}
.win{--tx:var(--ink);--mu:#555b70;--ln:rgba(0,0,0,.18);color:var(--ink);padding:3px;border:2px solid;border-color:var(--hi) var(--sh) var(--sh) var(--hi);border-radius:7px;backdrop-filter:none;box-shadow:1px 1px 0 #2b2f3d,0 14px 34px rgba(0,0,0,.4)}
.tb{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 55%,#0a1330),var(--ac));color:#fff;border-radius:4px;padding:4px 6px}
.tb button,.bar2 button,.sm,.btn,.calc button{border:2px solid;border-color:var(--hi) var(--sh) var(--sh) var(--hi);border-radius:3px;color:var(--ink)}
.tb button{width:22px;height:20px;padding:0;line-height:1;font-size:12px}
.tb button:hover,.bar2 button:hover,.sm:hover,.calc button:hover{background:#eceef4}
.tb button:active,.bar2 button:active,.sm:active,.btn:active,.calc button:active{border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.tb .x:hover{background:#e5484d;color:#fff}
.body{background:#eef0f5;color:var(--ink);margin-top:3px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.term{color:#d8f5e8;background:#0f1220}.term .pr{color:#7dffcf}
textarea.np{background:#fff;color:#111}
.bar2{background:var(--face);border-bottom:1px solid #b3b8c6}
.fi:hover{background:#cfe0ff}
.calc .d{background:#fff;color:#111;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);border-radius:3px}
.calc .op{background:color-mix(in srgb,var(--ac) 30%,#fff)}
.win select{background:#fff;color:#111;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:4px}
.sw{border:2px solid var(--ink)}
/* Taskleiste */
#bar{height:44px;padding:3px 6px;gap:6px;border-top:2px solid var(--hi);box-shadow:0 -1px 0 var(--sh);backdrop-filter:none}
#start{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;font-weight:700;font-size:15px;border:2px solid;border-color:var(--hi) #2b2f3d #2b2f3d var(--hi);border-radius:4px}
#start::before{content:"";width:16px;height:16px;background:linear-gradient(#ff5a36,#ff5a36) 0 0/7px 7px,linear-gradient(#5ec45a,#5ec45a) 9px 0/7px 7px,linear-gradient(#3b8cff,#3b8cff) 0 9px/7px 7px,linear-gradient(#ffc83b,#ffc83b) 9px 9px/7px 7px;background-repeat:no-repeat}
#start:active{border-color:#2b2f3d var(--hi) var(--hi) #2b2f3d}
.sep{width:2px;height:28px;border-left:1px solid var(--sh);border-right:1px solid var(--hi)}
.tk{height:34px;border:2px solid;border-color:var(--hi) var(--sh) var(--sh) var(--hi);border-radius:3px;max-width:170px;padding:0 10px}
.tk.on{border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:repeating-conic-gradient(#eef0f5 0 25%,#dfe2ea 0 50%) 0 0/4px 4px;font-weight:700}
#clock{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:0 12px;color:var(--ink);line-height:1.15;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);border-radius:3px;font-size:13px}
#clock small{color:#555b70;font-size:11px}
#menu{width:250px;padding:3px 3px 3px 38px;border:2px solid;border-color:var(--hi) #2b2f3d #2b2f3d var(--hi);border-radius:6px;backdrop-filter:none;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
#menu::before{content:"MickOS";position:absolute;left:3px;top:3px;bottom:3px;width:30px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:18px;letter-spacing:1px;color:#fff;background:linear-gradient(0deg,var(--ac),#0a1330);border-radius:3px}
#menu button{color:var(--ink);padding:9px 10px}
#menu button:hover{background:var(--ac);color:#fff}
#menu hr{border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:4px 0}
/* Anmeldefenster */
.card{width:min(380px,92vw);padding:3px;border:2px solid;border-color:var(--hi) #2b2f3d #2b2f3d var(--hi);border-radius:7px;backdrop-filter:none;box-shadow:1px 1px 0 #2b2f3d,0 20px 50px rgba(0,0,0,.45)}
.ltb{cursor:default}
.lbody{display:grid;gap:10px;padding:16px 16px 12px;background:#eef0f5;margin-top:3px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.av{width:54px;height:54px;display:grid;place-items:center;font-size:30px;background:#fff;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);border-radius:4px}
.card h1{font-size:22px;margin:0;color:var(--ink)}.card p{margin:2px 0 0;color:#555b70}
.card label{display:grid;gap:4px;font-size:12px;color:var(--ink)}
.card input{width:100%;margin:0;padding:8px 10px;background:#fff;color:#111;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);border-radius:3px}
.card .btn{padding:9px;font-weight:700;margin-top:4px}
.err{color:#c0202f;margin:0}
</style></head><body>
<div class="wall" id="wall"></div>
<div id="login"><form class="card" id="lf" autocomplete="off">
<div class="tb ltb"><span>🔒</span><b>MickOS – Anmelden</b></div>
<div class="lbody"><div class="hero"><div class="av">👤</div><div><h1>MickOS</h1><p>Gib deine Zugangsdaten ein.</p></div></div>
<label>Benutzername<input id="u" autocomplete="username" required></label>
<label>Passwort<input id="p" type="password" autocomplete="current-password" required></label>
<button class="btn" id="lb">Anmelden</button><div class="err" id="le" role="alert"></div></div></form></div>
<div id="os" hidden>
<div id="desk"><div class="icons" id="icons"></div></div>
<div id="bar"><button id="start" aria-haspopup="true">Start</button><span class="sep"></span><div id="tasks"></div><div id="clock"></div></div>
<div id="menu" hidden></div>
</div>
<script>
"use strict";
const CFG={hash:"__AUTH_HASH__",salt:"__AUTH_SALT__"};
const $=(s,e=document)=>e.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("mickos."+k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem("mickos."+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Anmeldung (PBKDF2, Hash wird beim Deploy aus GitHub Secrets erzeugt) ---------- */
const enc=new TextEncoder();
async function derive(u,p){
 const k=await crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]);
 const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(CFG.salt),iterations:150000},k,256);
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const configured=!CFG.hash.startsWith("__");
$("#lf").onsubmit=async e=>{
 e.preventDefault();const err=$("#le");err.textContent="";
 if(!configured){err.textContent="Nicht konfiguriert: Secrets fehlen. Siehe README.";return}
 $("#lb").disabled=true;
 try{if(await derive($("#u").value,$("#p").value)===CFG.hash){try{sessionStorage.setItem("mickos.auth","1")}catch(x){}boot()}
 else err.textContent="Benutzername oder Passwort stimmt nicht."}
 catch(x){err.textContent="Anmeldung nicht möglich. Öffne die Seite über HTTPS."}
 $("#lb").disabled=false;$("#p").value="";
};
function logout(){try{sessionStorage.removeItem("mickos.auth")}catch(e){}location.reload()}

/* ---------- Dateisystem ---------- */
let FS=store.get("fs",null)||{home:{"willkommen.txt":"Willkommen bei MickOS!\nÖffne das Terminal und tippe 'help'.",dokumente:{},bilder:{}}};
const saveFS=()=>store.set("fs",FS);
const nodeAt=p=>p.reduce((n,s)=>n&&typeof n==="object"?n[s]:undefined,FS);
const isDir=n=>n&&typeof n==="object";

/* ---------- Fenster-Manager ---------- */
let z=10,count=0;const wins=new Set();
function openApp(name,arg){
 const a=APPS[name];if(!a)return;
 const w=el("div","win");w.style.cssText=`left:${50+(count%8)*28}px;top:${30+(count%8)*28}px;width:${a.w}px;height:${a.h}px`;count++;
 const tb=el("div","tb",`<span>${a.i}</span><b></b><button title="Minimieren">–</button><button title="Maximieren">□</button><button class="x" title="Schließen">✕</button>`);
 const [mn,mx,cl]=tb.querySelectorAll("button");const body=el("div","body");w.append(tb,body);$("#desk").append(w);
 const tk=el("button","tk",a.i+" "+a.t);$("#tasks").append(tk);
 const api={setTitle(t){$("b",tb).textContent=t;tk.textContent=a.i+" "+t},close(){w.remove();tk.remove();wins.delete(w)}};
 const focus=()=>{w.classList.remove("min");w.style.zIndex=++z;wins.forEach(x=>x.tk.classList.remove("on"));tk.classList.add("on")};
 w.tk=tk;wins.add(w);api.setTitle(a.t);
 w.addEventListener("pointerdown",focus);
 tk.onclick=()=>{if(tk.classList.contains("on")&&!w.classList.contains("min")){w.classList.add("min");tk.classList.remove("on")}else focus()};
 mn.onclick=()=>{w.classList.add("min");tk.classList.remove("on")};
 mx.onclick=()=>w.classList.toggle("max");cl.onclick=api.close;
 tb.ondblclick=e=>{if(!e.target.closest("button"))w.classList.toggle("max")};
 tb.onpointerdown=e=>{
  if(e.target.closest("button")||w.classList.contains("max"))return;
  const r=w.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);
  tb.onpointermove=m=>{w.style.left=Math.max(0,Math.min(innerWidth-60,m.clientX-dx))+"px";w.style.top=Math.max(0,Math.min(innerHeight-90,m.clientY-dy))+"px"};
  tb.onpointerup=()=>{tb.onpointermove=null};
 };
 focus();a.run(body,api,arg);return w;
}

/* ---------- Apps ---------- */
const APPS={
terminal:{t:"Terminal",i:"⌨️",w:620,h:380,run(b,api){
 const t=el("div","term");b.append(t);let cwd=["home"];
 const out=s=>{t.insertBefore(document.createTextNode(s+"\n"),line)};
 const path=()=>"/"+cwd.join("/");
 const res=p=>{let r=p.startsWith("/")?[]:[...cwd];for(const s of p.split("/")){if(!s||s===".")continue;s===".."?r.pop():r.push(s)}return r};
 const line=el("div","",`<span class="pr"></span> <input aria-label="Befehl" spellcheck="false" autocomplete="off">`);
 const inp=$("input",line),pr=$(".pr",line);t.append(line);
 const upd=()=>pr.textContent="mick@mickos:"+path()+"$";upd();
 const hist=[];let hi=0;
 const C={
  help:()=>out("help ls cd pwd cat mkdir touch rm echo clear date whoami neofetch open <app> logout\nApps: "+Object.keys(APPS).join(", ")),
  ls:a=>{const n=nodeAt(a[0]?res(a[0]):cwd);isDir(n)?out(Object.keys(n).map(k=>isDir(n[k])?k+"/":k).join("  ")||"(leer)"):out("Kein Ordner.")},
  cd:a=>{const p=res(a[0]||"/home");isDir(nodeAt(p))?(cwd=p,upd()):out("Ordner nicht gefunden.")},
  pwd:()=>out(path()),
  cat:a=>{const n=nodeAt(res(a[0]||""));typeof n==="string"?out(n):out("Datei nicht gefunden.")},
  mkdir:a=>{const p=res(a[0]||""),n=p.pop(),d=nodeAt(p);if(isDir(d)&&n&&!(n in d)){d[n]={};saveFS()}else out("Nicht möglich.")},
  touch:a=>{const p=res(a[0]||""),n=p.pop(),d=nodeAt(p);if(isDir(d)&&n){d[n]=d[n]??"";saveFS()}else out("Nicht möglich.")},
  rm:a=>{const p=res(a[0]||""),n=p.pop(),d=nodeAt(p);if(isDir(d)&&n in d){delete d[n];saveFS()}else out("Nicht gefunden.")},
  echo:a=>out(a.join(" ")),clear:()=>{[...t.childNodes].forEach(n=>n!==line&&n.remove())},
  date:()=>out(new Date().toLocaleString("de-DE")),whoami:()=>out("mick.schranz"),
  neofetch:()=>out("MickOS 1.0\nBrowser: "+navigator.userAgent.split(") ").pop()+"\nAuflösung: "+innerWidth+"x"+innerHeight+"\nFenster offen: "+wins.size),
  open:a=>APPS[a[0]]?openApp(a[0]):out("Unbekannte App."),logout
 };
 inp.onkeydown=e=>{
  if(e.key==="ArrowUp"&&hist.length){hi=Math.max(0,hi-1);inp.value=hist[hi]}
  else if(e.key==="ArrowDown"){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||""}
  else if(e.key==="Enter"){
   const v=inp.value.trim();inp.value="";out(pr.textContent+" "+v);
   if(v){hist.push(v);hi=hist.length;const[c,...a]=v.split(/\s+/);C[c]?C[c](a):out("Unbekannter Befehl: "+c)}
   t.scrollTop=t.scrollHeight}
 };
 t.onclick=()=>inp.focus();setTimeout(()=>inp.focus(),50);out("MickOS Terminal – tippe 'help'.");
}},
notepad:{t:"Notizen",i:"📝",w:520,h:380,run(b,api,path){
 const bar=el("div","bar2",`<button>Speichern</button><span style="color:var(--mu)"></span>`),ta=el("textarea","np");ta.setAttribute("aria-label","Text");
 const st=$("span",bar);b.append(bar,ta);let p=path||null;
 if(p){const n=nodeAt(p);ta.value=typeof n==="string"?n:"";api.setTitle(p[p.length-1])}
 $("button",bar).onclick=()=>{
  if(!p){const n=prompt("Dateiname (wird in /home gespeichert):","notiz.txt");if(!n||/[\/]/.test(n))return;p=["home",n];api.setTitle(n)}
  const d=nodeAt(p.slice(0,-1));if(isDir(d)){d[p[p.length-1]]=ta.value;saveFS();st.textContent="Gespeichert um "+new Date().toLocaleTimeString("de-DE")}
 };
}},
files:{t:"Dateien",i:"📁",w:520,h:380,run(b,api){
 let cwd=["home"];const bar=el("div","bar2"),list=el("div","fl");b.append(bar,list);
 const draw=()=>{
  api.setTitle("/"+cwd.join("/"));bar.innerHTML=`<button data-a="up">↑ Hoch</button><button data-a="nf">+ Ordner</button><button data-a="nt">+ Datei</button>`;
  const d=nodeAt(cwd);list.innerHTML="";
  const ks=Object.keys(d).sort((a,c)=>isDir(d[c])-isDir(d[a])||a.localeCompare(c));
  if(!ks.length)list.append(el("div","fi","<span style='color:var(--mu)'>Dieser Ordner ist leer. Lege oben eine Datei oder einen Ordner an.</span>"));
  ks.forEach(k=>{const r=el("div","fi",`<span>${isDir(d[k])?"📁":"📄"}</span><span class="n">${esc(k)}</span><button class="sm" title="Löschen">🗑</button>`);
   $(".n",r).onclick=()=>isDir(d[k])?(cwd=[...cwd,k],draw()):openApp("notepad",[...cwd,k]);
   $("button",r).onclick=()=>{if(confirm(k+" löschen?")){delete d[k];saveFS();draw()}};list.append(r)});
 };
