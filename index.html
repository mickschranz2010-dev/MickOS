<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MickOS</title>
<style>
:root{--ac:#3b7be8;--glass:rgba(20,22,42,.86);--tx:#eef0fa;--mu:#9aa0c0;--ln:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:#10122a}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wall{position:fixed;inset:0;background:linear-gradient(135deg,#14182e,#3b1d4a);background-size:cover}
.wall.w2{background:linear-gradient(160deg,#06222b,#0d5c63 60%,#1b3a4b)}
.wall.w3{background:radial-gradient(circle at 30% 20%,#5b2a86,#1a1033 60%,#0b0a1a)}
.wall.w4{background:#16181f}
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:9999}
.card{width:min(360px,92vw);background:var(--glass);border:1px solid var(--ln);border-radius:14px;padding:28px;backdrop-filter:blur(18px)}
.card h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
.card p{margin:0 0 18px;color:var(--mu)}
.card input{width:100%;margin-bottom:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--ln);background:rgba(255,255,255,.06)}
.btn{background:var(--ac);color:#08111a;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.card .btn{width:100%}
.err{color:#ff8a9a;min-height:20px;margin-top:8px}
#desk{position:fixed;inset:0 0 44px 0}
.icons{position:absolute;inset:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.ico{width:84px;padding:8px 4px;text-align:center;background:none;border:0;border-radius:8px}
.ico:hover{background:rgba(255,255,255,.1)}
.ico span{display:block;font-size:30px}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--glass);border-top:1px solid var(--ln);backdrop-filter:blur(18px);z-index:5000}
#start{background:var(--ac);color:#08111a;border:0;border-radius:8px;padding:6px 14px;font-weight:700}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
.tk{background:rgba(255,255,255,.07);border:0;border-bottom:2px solid transparent;border-radius:6px;padding:5px 10px;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tk.on{border-bottom-color:var(--ac);background:rgba(255,255,255,.15)}
#clock{padding:0 8px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
#menu{position:fixed;left:8px;bottom:52px;width:240px;background:var(--glass);border:1px solid var(--ln);border-radius:12px;padding:8px;backdrop-filter:blur(18px);z-index:5001}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px}
#menu button:hover{background:rgba(255,255,255,.1)}
#menu hr{border:0;border-top:1px solid var(--ln);margin:6px 0}
.win{position:absolute;display:flex;flex-direction:column;max-width:100vw;min-width:260px;min-height:160px;background:var(--glass);border:1px solid var(--ln);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(18px);resize:both;overflow:hidden}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 44px)!important;border-radius:0;resize:none}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(255,255,255,.05);cursor:move;touch-action:none;user-select:none}
.tb b{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb button{width:26px;height:24px;border:0;border-radius:5px;background:rgba(255,255,255,.08)}
.tb button:hover{background:rgba(255,255,255,.2)}
.tb .x:hover{background:#e5484d}
.body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.term{font:13px/1.5 Consolas,monospace;padding:10px;background:rgba(0,0,0,.35);height:100%;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term input{background:none;border:0;outline:0;width:70%;font:inherit}
.pr{color:var(--ac)}
textarea.np{flex:1;resize:none;border:0;background:rgba(0,0,0,.25);padding:10px;font:14px/1.5 Consolas,monospace;outline:0}
.bar2{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--ln);align-items:center}
.bar2 button,.sm{background:rgba(255,255,255,.1);border:0;border-radius:6px;padding:5px 10px}
.bar2 button:hover,.sm:hover{background:rgba(255,255,255,.2)}
.fl{padding:6px;overflow:auto}
.fi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}
.fi:hover{background:rgba(255,255,255,.08)}
.fi .n{flex:1;cursor:pointer}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;flex:1}
.calc .d{grid-column:1/5;background:rgba(0,0,0,.35);border-radius:8px;padding:10px;text-align:right;font-size:26px;overflow:hidden}
.calc button{background:rgba(255,255,255,.1);border:0;border-radius:8px;font-size:18px}
.calc button:hover{background:rgba(255,255,255,.2)}
.calc .op{background:var(--ac);color:#08111a}
.set{padding:14px;display:grid;gap:14px}
.sw{display:inline-block;width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);margin-right:6px}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .12s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
@media (max-width:600px){.win{width:96vw!important;left:2vw!important}}

/* ===== macOS-Stil: Menüleiste oben, Dock unten, Ampel-Buttons, helles Milchglas ===== */
:root{--ac:#0a84ff;--tx:#1d1d1f;--mu:#6e6e73;--ln:rgba(0,0,0,.1);--glass:rgba(246,246,248,.8)}
html,body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
.wall{background:radial-gradient(70% 60% at 78% 18%,rgba(255,184,107,.95),transparent 60%),radial-gradient(80% 70% at 12% 28%,rgba(123,92,255,.9),transparent 65%),radial-gradient(90% 60% at 50% 112%,rgba(255,95,158,.9),transparent 60%),linear-gradient(160deg,#2b2f8f,#5b3fb0 50%,#c0568f)}
#desk{inset:28px 0 0 0}
.ico{color:#fff;border-radius:10px;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.ico:hover{background:rgba(255,255,255,.16)}
/* Menüleiste */
#mb{position:fixed;top:0;left:0;right:0;height:28px;display:flex;align-items:center;gap:2px;padding:0 10px;background:rgba(24,24,34,.3);backdrop-filter:blur(30px) saturate(1.8);color:#fff;z-index:6000;text-shadow:0 1px 2px rgba(0,0,0,.3)}
#mb #start{background:none;border:0;color:#fff;font-size:15px;padding:1px 9px;border-radius:5px;height:auto}
#mb #start:hover,#mb .m:hover{background:rgba(255,255,255,.2)}
#appname{font-weight:700;padding:1px 9px}
#mb .m{padding:1px 9px;border-radius:5px}
.sp{flex:1}
#clock{padding:0 8px;font-weight:500}
#menu{left:8px;top:30px;bottom:auto;width:230px;padding:5px;border-radius:10px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.5);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 14px 40px rgba(0,0,0,.3);color:var(--tx);z-index:6001}
#menu button{color:var(--tx);padding:6px 10px;border-radius:5px}
#menu button:hover{background:var(--ac);color:#fff}
#menu hr{border-top:1px solid var(--ln);margin:5px 6px}
/* Dock */
#dock{position:fixed;left:0;right:0;bottom:8px;display:flex;justify-content:center;z-index:5000;pointer-events:none}
#tasks{flex:none;overflow:visible;pointer-events:auto;display:flex;align-items:flex-end;gap:8px;padding:7px 10px 9px;border-radius:24px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dk{position:relative;width:52px;height:52px;border:0;border-radius:13px;font-size:28px;display:grid;place-items:center;transform-origin:50% 100%;transition:transform .2s cubic-bezier(.3,1.6,.5,1);box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.45)}
.dk:hover{transform:scale(1.4) translateY(-3px)}
.dk:hover+.dk,.dk:has(+.dk:hover){transform:scale(1.16)}
.dk::before{content:attr(data-t);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);padding:3px 10px;border-radius:7px;background:rgba(40,40,44,.88);color:#fff;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.dk:hover::before{opacity:1}
.dk.run::after{content:"";position:absolute;bottom:-7px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.5)}
.dk.bn{animation:bn .5s 2}@keyframes bn{40%{transform:translateY(-24px)}}
[data-app=terminal]{background:linear-gradient(#4a4a4f,#1c1c1e)}[data-app=files]{background:linear-gradient(#5ac8fa,#0a7aff)}[data-app=browser]{background:linear-gradient(#e8f4ff,#8cc8ff)}
[data-app=notepad]{background:linear-gradient(#fff3a8,#ffd60a)}[data-app=calc]{background:linear-gradient(#ffb340,#ff7a00)}[data-app=settings]{background:linear-gradient(#c7c9cf,#7d8087)}
/* Fenster */
.win{padding:0;border:1px solid rgba(255,255,255,.55);border-radius:12px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.8);box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 22px 60px rgba(0,0,0,.35);color:var(--tx)}
.win.max{height:calc(100% - 92px)!important;border-radius:0}
.tb{height:38px;padding:0 14px;gap:0;background:rgba(255,255,255,.4);border-bottom:1px solid var(--ln);border-radius:0;color:var(--tx);cursor:default}
.tl{display:flex;gap:8px;width:56px}
.tl button{width:12px;height:12px;padding:0;border:0;border-radius:50%;font-size:9px;line-height:12px;color:transparent;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.tl .x{background:#ff5f57}.tl button:nth-child(2){background:#febc2e}.tl button:nth-child(3){background:#28c840}
.tl:hover .x::after{content:"✕";color:rgba(70,0,0,.7)}.tl:hover button:nth-child(2)::after{content:"–";color:rgba(70,45,0,.7)}.tl:hover button:nth-child(3)::after{content:"+";color:rgba(0,60,0,.7)}
.win:not(.act) .tl button{background:#cfcfd4}
.tb b{text-align:center;font-weight:600;font-size:13px;padding-right:56px}
.tb .x:hover{background:#ff5f57}
.body{background:rgba(255,255,255,.5)}
.bar2,.bbar{background:rgba(255,255,255,.45);border-bottom:1px solid var(--ln)}
.bar2 button,.sm,.calc button,.tile{background:#fff;color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:4px 12px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bar2 button:hover,.sm:hover{background:#f2f2f6}
.fi{border-radius:7px}.fi:hover{background:rgba(10,132,255,.14)}
.th{width:28px;height:28px;object-fit:cover;border-radius:5px}
.term{background:rgba(28,28,30,.93);color:#e5e5e7}.term .pr{color:#32d74b}
textarea.np{background:rgba(255,255,255,.7);color:var(--tx)}
.calc{background:#2c2c2e;gap:1px}.calc .d{background:#1c1c1e;color:#fff;border-radius:0;font-weight:200;font-size:36px}
.calc button{background:#505054;color:#fff;border:0;border-radius:0;box-shadow:none;font-size:20px}.calc button:hover{background:#6a6a6e}
.calc .op{background:#ff9f0a}.calc .op:hover{background:#ffb340}
.win select{background:#fff;color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:5px}
.sw{border:2px solid #fff;box-shadow:0 0 0 1px var(--ln)}
.btn{background:var(--ac);color:#fff}
.pv{flex:1;display:grid;place-items:center;overflow:auto;background:rgba(0,0,0,.07);min-height:0}.pv img{max-width:100%;max-height:100%;object-fit:contain}
/* Browser */
.bbar button{background:rgba(0,0,0,.05);color:var(--tx)}.bbar button:hover{background:rgba(0,0,0,.12)}
.bbar input,.bhome input{background:rgba(0,0,0,.06);border:1px solid transparent;color:var(--tx)}
.bbar input:focus,.bhome input:focus{border-color:var(--ac);background:#fff}
.tile{padding:14px 6px}.tile:hover{background:#f2f2f6}
/* Anmeldung */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:rgba(0,0,0,.14);backdrop-filter:blur(14px)}
.lk{display:grid;text-align:center;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.3)}.lk b{font-size:84px;font-weight:200;line-height:1;letter-spacing:-1px}.lk span{font-size:18px;font-weight:500;opacity:.9}
.card{width:260px;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;color:#fff}
.lbody{display:grid;gap:10px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:6px}
.av{width:88px;height:88px;display:grid;place-items:center;font-size:44px;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(10px)}
.card h1{font-size:20px;margin:0;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.3)}.card p{margin:0;font-size:12px;color:rgba(255,255,255,.85)}
.card label{display:grid;gap:4px;font-size:11px;color:rgba(255,255,255,.85)}
.card input{height:36px;margin:0;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px)}
.card input:focus{outline:0;border-color:#fff;background:rgba(255,255,255,.32)}
.card .btn{height:36px;border-radius:18px;background:rgba(255,255,255,.92);color:#1d1d1f;border:0;margin-top:4px;font-weight:600}
.err{color:#ffd6d6;margin:0;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.4)}

/* Präzisere macOS-ähnliche Interaktionen */
html,body,#os,#desk{user-select:none}
input,textarea,.term{user-select:text}
button,.ico,.dk{ -webkit-tap-highlight-color:transparent }
body{cursor:default}
button,.ico,.dk,.fi .n,.tile,.sm,.bar2 button{cursor:pointer}
.tb{cursor:grab;touch-action:none}
.tb:active{cursor:grabbing}
.win{min-width:260px;min-height:160px;overflow:hidden;will-change:left,top,width,height}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 92px)!important;resize:none}
.win:not(.max){resize:both}
.win .body{min-width:0}
.dk{flex:0 0 52px;cursor:pointer;outline-offset:3px}
.dk:focus-visible{outline:2px solid #fff}
.dk.run::after{bottom:-7px}
#dock{padding:0 12px;max-width:100%;box-sizing:border-box}
#tasks{max-width:calc(100vw - 24px);overflow:visible;min-width:0}
@media(max-width:600px){
 #tasks{gap:5px;padding:6px 7px 8px;border-radius:18px}
 .dk{width:42px;height:42px;flex-basis:42px;font-size:23px;border-radius:11px}
 .dk:hover{transform:scale(1.12) translateY(-2px)}
 .win{min-width:0!important;width:96vw!important;max-width:96vw;left:2vw!important}
 .win.max{left:0!important;width:100%!important}
 #mb{padding:0 5px;gap:0}
 #mb .m{display:none}
 #appname{padding:1px 5px}
}
@media(prefers-reduced-motion:reduce){.dk,.dk::before,.win{animation:none!important;transition:none!important}}

/* MickOS Studio polish — Monterey-inspired glass, spacing and motion */
:root{
 --glass:rgba(248,248,250,.76);
 --ln:rgba(255,255,255,.48);
 --ac: #0a84ff;
 --dock-bg:rgba(238,238,245,.30);
 --dock-edge:rgba(255,255,255,.58);
 --shadow-window:0 1px 1px rgba(0,0,0,.06),0 18px 55px rgba(0,0,0,.27),0 2px 12px rgba(0,0,0,.08);
}
.wall{
 background:
  radial-gradient(ellipse at 18% 22%,rgba(255,174,106,.96) 0%,rgba(255,125,112,.50) 24%,transparent 48%),
  radial-gradient(ellipse at 77% 18%,rgba(113,94,255,.95) 0%,rgba(100,78,221,.54) 27%,transparent 54%),
  radial-gradient(ellipse at 65% 83%,rgba(255,81,156,.92) 0%,rgba(185,68,187,.46) 31%,transparent 58%),
  radial-gradient(ellipse at 24% 86%,rgba(42,174,222,.75) 0%,transparent 48%),
  linear-gradient(135deg,#252b79 0%,#4b318c 48%,#9a3d8e 100%);
 background-size:cover;
}
#mb{
 height:30px;padding:0 14px;
 background:rgba(28,28,35,.25);
 border-bottom:1px solid rgba(255,255,255,.10);
 backdrop-filter:blur(36px) saturate(1.9);
 -webkit-backdrop-filter:blur(36px) saturate(1.9);
}
#mb #start{font-size:16px;font-weight:700}
#appname{font-weight:650;letter-spacing:-.15px}
#clock{font-size:12px;letter-spacing:.05px}
#desk{inset:30px 0 0}
#dock{bottom:10px;z-index:7000}
#tasks{
 gap:8px;padding:8px 10px 10px;
 background:var(--dock-bg);
 border:1px solid var(--dock-edge);
 box-shadow:0 10px 34px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.5);
 backdrop-filter:blur(36px) saturate(1.85);
 -webkit-backdrop-filter:blur(36px) saturate(1.85);
}
.dk{
 width:50px;height:50px;flex-basis:50px;
 border-radius:13px;
 box-shadow:0 3px 7px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.5);
 transition:transform .16s cubic-bezier(.2,.8,.2,1),filter .16s ease;
 will-change:transform;
}
.dk:hover{filter:brightness(1.06)}
.dk::before{
 bottom:calc(100% + 13px);padding:5px 9px;
 border:1px solid rgba(255,255,255,.13);
 background:rgba(28,28,32,.88);
 box-shadow:0 5px 18px rgba(0,0,0,.18);
 backdrop-filter:blur(16px);
}
.dk.run::after{width:4px;height:4px;bottom:-6px;background:rgba(255,255,255,.95)}
.dk.running-min::after{opacity:.45}
.win{
 border-color:rgba(255,255,255,.64);
 box-shadow:var(--shadow-window);
 backdrop-filter:blur(38px) saturate(1.65);
 -webkit-backdrop-filter:blur(38px) saturate(1.65);
 transition:box-shadow .16s ease,border-color .16s ease;
}
.win.act{border-color:rgba(255,255,255,.78);box-shadow:0 0 0 1px rgba(255,255,255,.12),var(--shadow-window)}
.win.closing{animation:mickos-window-out .16s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes mickos-window-out{to{opacity:0;transform:translateY(10px) scale(.96)}}
.win:not(.act){filter:saturate(.94)}
.tb{height:40px;background:rgba(250,250,252,.58);cursor:grab}
.tb:active{cursor:grabbing}
.tb b{font-size:12px;letter-spacing:.05px}
.tl{width:58px;flex-shrink:0}
.tl button{transition:filter .12s ease,transform .12s ease}
.tl button:active{transform:scale(.9)}
.body{background:rgba(250,250,252,.58)}
.bar2,.bbar{min-height:38px}
.bar2 button,.sm,.tile{transition:background .14s ease,transform .14s ease}
.bar2 button:active,.sm:active{transform:scale(.98)}
.icons{inset:18px 16px 18px 16px;gap:8px}
.ico{width:88px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.65)}
.ico span{font-size:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.ico:focus-visible{outline:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.18)}
#menu{backdrop-filter:blur(34px) saturate(1.7);-webkit-backdrop-filter:blur(34px) saturate(1.7)}
@media(max-width:600px){
 #tasks{gap:5px;padding:6px 7px 8px}
 .dk{width:42px;height:42px;flex-basis:42px;border-radius:11px}
 .icons{inset:10px;gap:4px}
 .ico{width:76px;min-height:72px;font-size:11px}
 .ico span{font-size:29px}
}
@media(prefers-reduced-motion:reduce){
 .dk,.tl button,.bar2 button,.sm,.tile,.win{transition:none!important}
}


/* ===== MickOS Clean Window System ===== */
:root{
  --mick-window-radius: 12px;
  --mick-window-border: rgba(25,25,30,.13);
  --mick-window-shadow: 0 24px 70px rgba(0,0,0,.24), 0 4px 14px rgba(0,0,0,.12), 0 0 0 1px rgba(255,255,255,.28);
  --mick-control-red: #ff5f57;
  --mick-control-yellow: #febc2e;
  --mick-control-green: #28c840;
  --mick-control-size: 12px;
  --mick-focus: #0a84ff;
}
button{
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button:focus-visible{
  outline: 2px solid var(--mick-focus);
  outline-offset: 2px;
}
#desk{
  overflow: hidden;
  isolation: isolate;
}
.win{
  min-width: 280px;
  min-height: 180px;
  max-width: calc(100vw - 12px);
  max-height: calc(100vh - 46px);

/* ---------- Anmeldung (PBKDF2, Hash wird beim Deploy aus GitHub Secrets erzeugt) ---------- */
const enc=new TextEncoder();

 const k=await crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]);
 const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(CFG.salt),iterations:150000},k,256);
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const configured=!CFG.hash.startsWith("__");

 e.preventDefault();const err=$("#le");err.textContent="";
 if(!configured){err.textContent="Nicht konfiguriert: Secrets fehlen. Siehe README.";return}

 try{if(await derive($("#u").value,$("#p").value)===CFG.hash){try{sessionStorage.setItem("mickos.auth","1")}catch(x){}boot()}
 else err.textContent="Benutzername oder Passwort stimmt nicht."}
 catch(x){err.textContent="Anmeldung nicht möglich. Öffne die Seite über HTTPS."}
 $("#lb").disabled=false;$("#p").value="";
};

/* ---------- Dateisystem ---------- */
let FS=store.get("fs",null)||{home:{"willkommen.txt":"Willkommen bei MickOS!\nÖffne das Terminal und tippe 'help'.",dokumente:{},bilder:{}}};

/* ---------- Fenster-Manager ---------- */
let z=10,count=0;
const wins=new Set();
const runState=()=>document.querySelectorAll(".dk").forEach(d=>{
 const related=[...wins].filter(w=>w.app===d.dataset.app);
 d.classList.toggle("run",related.length>0);
 d.classList.toggle("running-min",related.length>0&&related.every(w=>w.classList.contains("min")));
});
function openApp(name,arg){
 const a=APPS[name];if(!a)return;
 const desk=$("#desk"),w=el("div","win");
 w.style.cssText=`left:${Math.max(8,50+(count%7)*26)}px;top:${Math.max(8,28+(count%7)*24)}px;width:${a.w}px;height:${a.h}px`;
 count++;
 const tb=el("div","tb",`<div class="tl"><button class="x" title="Schließen" aria-label="Schließen"></button><button title="Minimieren" aria-label="Minimieren"></button><button title="Vollbild" aria-label="Vollbild"></button></div><b></b>`);

 w.append(tb,body);desk.append(w);

  setTitle(t){$("b",tb).textContent=t},

 };

  const top=[...wins].filter(x=>!x.classList.contains("min")).sort((x,y)=>(+y.style.zIndex)-(+x.style.zIndex))[0];
  wins.forEach(x=>x.classList.remove("act"));
  if(top){top.classList.add("act");$("#appname").textContent=APPS[top.app]?.t||"Finder"}

 };

  if(w.classList.contains("min"))return;

  if(w.animate){const anim=w.animate([{opacity:1,transform:"translateY(0) scale(1)"},{opacity:0,transform:"translateY(18px) scale(.88)"}],{duration:170,easing:"cubic-bezier(.4,0,1,1)"});anim.onfinish=finish;anim.oncancel=finish}else finish();
 };

 w.app=name;wins.add(w);api.setTitle(a.t);
 w.addEventListener("pointerdown",focus);

 tb.onpointerdown=e=>{
  if(e.target.closest("button")||e.button!==0)return;
  focus();
  if(w.classList.contains("max")){
   const r=w.getBoundingClientRect(),ratio=Math.max(.12,Math.min(.88,(e.clientX-r.left)/r.width));
   w.classList.remove("max");
   const width=beforeMax?.width||`${Math.min(760,desk.clientWidth-24)}px`;
   const height=beforeMax?.height||`${Math.min(520,desk.clientHeight-24)}px`;
   w.style.width=width;w.style.height=height;

   w.style.left=Math.max(0,Math.min(desk.clientWidth-ww,e.clientX-desk.getBoundingClientRect().left-ww*ratio))+"px";

}

/* ---------- Apps ---------- */
const APPS={
terminal:{t:"Terminal",i:"⌨️",w:620,h:380,run(b,api){

 // Smooth proximity magnification: a cosine falloff keeps motion subtle and GPU-friendly.

  if(e.pointerType==="touch")return;

   const items=[...dock.querySelectorAll(".dk")];
   items.forEach(item=>{
    const r=item.getBoundingClientRect(),center=r.left+r.width/2;
